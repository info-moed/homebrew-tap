name: Update NS2 Bridge cask

on:
  schedule:
    - cron: "17 6 * * *"      # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bump the cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/info-moed/NS2Bridge/releases/latest --jq .tag_name)
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/ns2bridge.rb)
          [ "$version" = "$current" ] && { echo "Up to date ($version)"; exit 0; }
          curl -fsSL -o ns2.zip "https://github.com/info-moed/NS2Bridge/releases/download/$tag/NS2Bridge-$version-macOS.zip"
          sha=$(sha256sum ns2.zip | cut -d' ' -f1)
          published=$(curl -fsSL "https://github.com/info-moed/NS2Bridge/releases/download/$tag/NS2Bridge-$version-macOS.zip.sha256" | cut -c1-64)
          [ "$sha" = "$published" ] || { echo "Checksum mismatch: $sha vs $published"; exit 1; }
          sed -i "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/ns2bridge.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ns2bridge $version"
          git push
